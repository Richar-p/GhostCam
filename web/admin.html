<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GhostCam</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f3ef; --card: #ffffff; --fg: #18181b; --muted: #71717a; --line: #e4e4e7;
    --accent: #18181b; --accent-fg: #fff; --rec: #dc2626; --ok: #16a34a; --warn-bg: #fef2f2; --warn-fg: #991b1b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f11; --card: #1a1a1d; --fg: #f4f4f5; --muted: #a1a1aa; --line: #2a2a2e;
            --accent: #f4f4f5; --accent-fg: #18181b; --warn-bg: #2a1214; --warn-fg: #fca5a5; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
         display: flex; flex-direction: column; padding: 20px; gap: 14px; user-select: none; }
  header { display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
  .pill { margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .pill.live { color: var(--rec); border-color: var(--rec); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .center { text-align: center; }
  .title { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0; }
  #qrbox { display: grid; place-items: center; padding: 14px; background: #fff; border-radius: 12px; margin: 16px auto 0; width: 260px; height: 260px; }
  #qr { width: 232px; height: 232px; image-rendering: pixelated; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--fg); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 8px auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .rec-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--rec); display: inline-block; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .timer { font: 600 44px/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; margin: 14px 0 6px; letter-spacing: -.02em; }
  .stats { display: flex; justify-content: center; gap: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .file { margin-top: 14px; font: 12px ui-monospace, Consolas, monospace; color: var(--muted); word-break: break-all; user-select: text; }
  .ready-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center;
                font-size: 22px; margin: 4px auto 12px; }
  #history { font-size: 13px; }
  #history b { font-weight: 600; }
  .error { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
  .actions { display: flex; gap: 8px; margin-top: auto; }
  button { flex: 1; font: inherit; font-weight: 500; padding: 10px 12px; border-radius: 10px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:hover { filter: brightness(.96); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .foot { color: var(--muted); font-size: 12px; text-align: center; }
  .icon-btn { flex: none; width: 34px; height: 34px; padding: 0; display: grid; place-items: center; border-radius: 9px; }
  #settings { position: fixed; inset: 0; background: var(--bg); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  #settings h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 8px 0 0; font-weight: 600; }
  .q { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; }
  .q:has(input:checked) { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg) inset; }
  .q input { margin: 3px 0 0; accent-color: var(--fg); }
  .q b { font-weight: 600; }
  .q .meta { color: var(--muted); font-size: 12.5px; }
  .q .risk { font-size: 12.5px; margin-top: 2px; }
  .risk.r0 { color: var(--ok); } .risk.r2, .risk.r3 { color: #d97706; }
  .note { border-radius: 12px; padding: 12px 14px; font-size: 13px; background: var(--card); border: 1px solid var(--line); }
  .note.hot { background: #fffbeb; border-color: #f59e0b; color: #78350f; }
  @media (prefers-color-scheme: dark) { .note.hot { background: #2b2111; color: #fcd34d; border-color: #b45309; } }
  .note ul { margin: 6px 0 0; padding-left: 18px; }
  .note li { margin: 3px 0; }
  .folder-row { display: flex; gap: 8px; }
  .folder-row input { flex: 1; min-width: 0; font: 12.5px ui-monospace, Consolas, monospace; padding: 9px 10px; border-radius: 10px;
                      border: 1px solid var(--line); background: var(--card); color: var(--fg); user-select: text; }
  .folder-row button { flex: none; }
  .folder-row select { flex: 1; font: inherit; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  #msg { font-size: 13px; min-height: 18px; }
  #msg.err { color: var(--rec); } #msg.ok { color: var(--ok); }
  #net-warn { color: #d97706; font-size: 13px; margin-top: 10px; }
  .foot a { color: inherit; }
  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 13px;
            background: var(--card); border: 1px solid #2563eb; }
  .banner #update-text { flex: 1; }
  .banner a { color: inherit; }
  .banner button { flex: none; padding: 6px 12px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; cursor: pointer; }
  .check input { accent-color: var(--fg); margin: 0; }
  .meta-line { color: var(--muted); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <img src="/icon.svg" width="26" height="26" alt="">
  <h1>GhostCam</h1>
  <span class="pill" id="pill" data-i18n="pc.pill.starting">Starting</span>
  <button class="icon-btn" id="open-settings" data-i18n-attr="aria-label:pc.settingsButton;title:pc.settingsButton">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="var(--card)"/><circle cx="15" cy="12" r="2" fill="var(--card)"/><circle cx="8" cy="18" r="2" fill="var(--card)"/></svg>
  </button>
</header>

<div class="banner" id="update" hidden>
  <span id="update-text"></span>
  <a href="#" id="update-notes" data-i18n="pc.update.notes"></a>
  <button id="update-btn" class="primary" data-i18n="pc.update.install">Update</button>
</div>

<section class="card center" id="v-starting">
  <div class="spinner"></div>
  <p class="title" data-i18n="pc.starting.title">Starting GhostCam…</p>
  <p class="sub" id="start-sub"></p>
</section>

<section class="card error" id="v-error" hidden>
  <p class="title" data-i18n="pc.error.title">Couldn't start</p>
  <p class="sub" id="err" style="color:inherit"></p>
</section>

<section class="card center" id="v-pair" hidden>
  <p class="title" data-i18n="pc.pair.title">Scan with your phone</p>
  <p class="sub"><span data-i18n="pc.pair.sub"></span><br><span data-i18n="pc.pair.sub2"></span></p>
  <div id="qrbox"><img id="qr" data-i18n-attr="alt:pc.pair.qrAlt" alt=""></div>
</section>

<section class="card center" id="v-ready" hidden>
  <div class="ready-icon">✓</div>
  <p class="title" data-i18n="pc.ready.title">Phone connected</p>
  <p class="sub" id="ready-sub"></p>
</section>

<section class="card center" id="v-live" hidden>
  <p class="sub"><span class="rec-dot"></span>&nbsp; <span data-i18n="pc.live.label"></span></p>
  <div class="timer" id="timer">00:00</div>
  <div class="stats"><span id="size"></span><span id="mode"></span></div>
  <div class="stats" style="margin-top:6px"><span id="rate"></span></div>
  <div id="net-warn" data-i18n="pc.live.netWarn" hidden></div>
  <div class="file" id="file"></div>
</section>

<section class="card" id="history" hidden></section>

<div class="actions">
  <button id="copy" data-i18n="pc.copy.button" hidden>Copy link</button>
  <button id="folder" class="primary" data-i18n="pc.openFolder">Open videos</button>
</div>
<div class="foot" id="foot"></div>

<section id="settings" hidden>
  <header>
    <button class="icon-btn" id="close-settings" data-i18n-attr="aria-label:pc.settings.back;title:pc.settings.back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 data-i18n="pc.settings.title">Settings</h1>
  </header>

  <h2 data-i18n="pc.settings.quality">Video quality</h2>
  <div id="qualities" role="radiogroup" style="display:flex;flex-direction:column;gap:8px"></div>
  <div class="note" id="q-warn"></div>

  <h2 data-i18n="pc.settings.buffer">Network buffer</h2>
  <div class="folder-row">
    <select id="buffer" data-i18n-attr="aria-label:pc.settings.buffer"></select>
  </div>
  <div class="note" id="buffer-help"></div>

  <h2 data-i18n="pc.settings.folder">Videos folder</h2>
  <div class="folder-row">
    <input id="dir" spellcheck="false" data-i18n-attr="aria-label:pc.settings.folder">
    <button id="pick" data-i18n="pc.settings.browse">Browse…</button>
  </div>

  <h2 data-i18n="pc.settings.updates">Updates</h2>
  <label class="check"><input type="checkbox" id="auto-update"><span data-i18n="pc.settings.autoCheck"></span></label>
  <div class="folder-row" style="align-items:center">
    <span class="meta-line" id="version-line" style="flex:1"></span>
    <button id="check-now" data-i18n="pc.settings.checkNow">Check now</button>
  </div>
  <div class="meta-line" id="update-check-msg"></div>

  <h2 data-i18n="pc.settings.language">Language</h2>
  <div class="folder-row">
    <select id="lang" data-i18n-attr="aria-label:pc.settings.language"></select>
  </div>

  <div id="msg"></div>
  <div class="actions" style="margin-top:0">
    <button id="save" class="primary" data-i18n="pc.settings.save">Save</button>
  </div>
  <p class="foot" style="margin:0" data-i18n="pc.settings.appliesNext"></p>
  <p class="foot" style="margin:0"><a href="#" id="lnk-licenses" data-i18n="pc.settings.licenses"></a> · <a href="#" id="lnk-source" data-i18n="pc.settings.source"></a> · AGPL-3.0</p>
</section>

<script src="/i18n.js"></script>
<script>
  const { t } = I18N;
  const $ = (id) => document.getElementById(id);
  const views = ['v-starting', 'v-error', 'v-pair', 'v-ready', 'v-live'];
  const show = (v) => views.forEach((id) => { $(id).hidden = id !== v; });
  const fmtTime = (s) => {
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60, p = (n) => String(n).padStart(2, '0');
    return (h ? h + ':' : '') + p(m) + ':' + p(sec);
  };
  const fmtSize = (b) => (b < 1024 ** 3 ? t('common.mb', { n: I18N.num(b / 1024 ** 2, 1) }) : t('common.gb', { n: I18N.num(b / 1024 ** 3, 2) }));
  const mbps = (bps) => t('common.mbps', { n: I18N.num(bps / 1e6, 1) });
  const modeName = (m) => t(m === 'webrtc' ? 'common.mode.direct' : 'common.mode.relay');
  const qualityName = (id) => t(`pc.quality.${id}.label`);
  let url = '', qrFor = '';
  let lastState = '', currentVersion = '';
  let samples = [], lastFile = '';

  async function tick() {
    let s;
    try { s = await (await fetch('/api/status', { cache: 'no-store' })).json(); }
    catch { $('pill').textContent = t('pc.pill.stopped'); return; }
    url = s.url;
    const pill = $('pill');
    pill.className = 'pill';
    $('copy').hidden = !url || s.state !== 'waiting';

    if (s.error) {
      show('v-error'); $('err').textContent = I18N.msg(s.error); pill.textContent = t('pc.pill.error');
    } else if (!url) {
      show('v-starting'); pill.textContent = t('pc.pill.starting');
      $('start-sub').textContent = s.progress ? I18N.msg(s.progress) : t('pc.starting.sub');
    } else if (s.state === 'recording') {
      show('v-live'); pill.textContent = t('pc.pill.rec'); pill.className = 'pill live';
      $('timer').textContent = s.file ? fmtTime(s.seconds) : '00:00';
      $('size').textContent = s.file ? fmtSize(s.bytes) : t('pc.live.starting');
      $('mode').textContent = s.buffered ? t('pc.live.buffered', { mode: modeName(s.mode) }) : modeName(s.mode);
      $('file').textContent = s.file;
      // Received bitrate over the last ~4 s, compared with the chosen quality.
      if (s.file !== lastFile) { samples = []; lastFile = s.file; }
      samples.push([Date.now(), s.bytes]);
      if (samples.length > 5) samples.shift();
      const [t0, b0] = samples[0], [t1, b1] = samples[samples.length - 1];
      const rate = t1 > t0 ? ((b1 - b0) * 8 * 1000) / (t1 - t0) : 0;
      const lag = s.buffered && s.lag >= 1 ? ' · ' + t('pc.live.lag', { n: Math.round(s.lag) }) : '';
      $('rate').textContent = s.file && samples.length > 2
        ? t('pc.live.rate', { rate: mbps(rate), target: mbps(s.targetBitrate), quality: qualityName(s.quality) }) + lag : '';
      $('net-warn').hidden = !(s.file && s.seconds > 6 && samples.length >= 5 && rate < 0.5 * s.targetBitrate && !s.buffered);
    } else if (s.state === 'connected') {
      show('v-ready'); pill.textContent = t('pc.pill.connected');
      $('ready-sub').textContent = t('pc.ready.sub', { mode: modeName(s.mode) });
    } else {
      show('v-pair'); pill.textContent = t('pc.pill.waiting');
      if (qrFor !== url) { $('qr').src = '/qr.png?' + Date.now(); qrFor = url; }
    }
    $('history').hidden = !s.count;
    if (s.count) {
      $('history').replaceChildren(
        el('b', { textContent: t('pc.history.count', { count: s.count }) }),
        el('div', { className: 'file', style: 'margin-top:4px', textContent: t('pc.history.last', { file: s.last, size: fmtSize(s.lastBytes) }) }),
      );
    }
    $('foot').textContent = s.upnp ? t('pc.foot.upnp') : t('pc.foot.dir', { dir: s.outDir });
    lastState = s.state;
    renderUpdate(s.update || {});
  }

  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(url); $('copy').textContent = t('pc.copy.done'); }
    catch { $('copy').textContent = t('pc.copy.failed'); }
    setTimeout(() => { $('copy').textContent = t('pc.copy.button'); }, 2000);
  });
  $('folder').addEventListener('click', () => fetch('/api/open-folder', { method: 'POST', headers: { 'X-GhostCam': '1' } }));

  // ------------------------------------------------------------- updates
  function renderUpdate(u) {
    currentVersion = u.current || '';
    const key = (u.state && u.state.key) || '';
    const working = /downloading|restarting/.test(key);
    const shown = /downloading|restarting|failed/.test(key);
    $('update').hidden = !(u.version || shown);
    $('update-text').textContent = shown ? I18N.msg(u.state) : t('pc.update.available', { version: u.version });
    $('update-notes').hidden = !u.version || working;
    $('update-btn').hidden = !u.version || working;
    $('update-btn').disabled = lastState === 'recording';
    $('update-btn').title = lastState === 'recording' ? t('pc.update.recording') : '';
    // Result of "Check now", shown in Settings.
    $('update-check-msg').textContent = /upToDate|checkFailed/.test(key) ? I18N.msg(u.state) : '';
    $('version-line').textContent = t('pc.settings.version', { version: currentVersion });
  }
  $('update-btn').addEventListener('click', async () => {
    // Restarting changes the pairing secret: the phone must scan again.
    if ((lastState === 'connected' || lastState === 'recording') && !confirm(t('pc.update.confirmPhone'))) return;
    const r = await post('/api/update');
    if (r.status === 409) {
      let m = { key: 'pc.update.failed', vars: { detail: '' } };
      try { m = await r.json(); } catch {}
      alert(I18N.msg(m));
    }
  });
  $('update-notes').addEventListener('click', (e) => { e.preventDefault(); post('/api/open/release'); });
  $('check-now').addEventListener('click', () => { $('update-check-msg').textContent = '…'; post('/api/update/check'); });

  // ------------------------------------------------------------ settings
  const RISK = { eco: 0, standard: 1, high: 2, max: 3 };
  let cfg = null;
  const post = (path, body) => fetch(path, { method: 'POST', headers: { 'X-GhostCam': '1', 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const selected = () => (document.querySelector('input[name=q]:checked') || {}).value;
  const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

  function renderWarn() {
    const q = cfg.qualities.find((x) => x.id === selected());
    if (!q) return;
    const hot = (RISK[q.id] ?? 1) >= 2;
    $('q-warn').className = 'note' + (hot ? ' hot' : '');
    $('q-warn').replaceChildren(
      el('b', { textContent: (hot ? t('pc.quality.warnHot') + ' ' : '') + t('pc.quality.warnNeed', { rate: mbps(q.bitrate) }) }),
      el('div', { textContent: t('pc.quality.warnIf'), style: 'margin-top:4px' }),
      el('ul', {},
        el('li', { textContent: t('pc.quality.warnDirect') }),
        el('li', { textContent: t('pc.quality.warnRelay') })),
    );
  }

  function renderBufferHelp() {
    const n = Number($('buffer').value);
    $('buffer-help').textContent = n ? t('pc.buffer.helpOn', { n }) : t('pc.buffer.helpOff');
    $('buffer-help').className = 'note' + (n >= 15 ? ' hot' : '');
  }

  async function openSettings() {
    $('msg').textContent = ''; $('msg').className = '';
    cfg = await (await fetch('/api/settings', { cache: 'no-store' })).json();
    $('qualities').replaceChildren(...cfg.qualities.map((q) => {
      const input = el('input', { type: 'radio', name: 'q', value: q.id, checked: q.id === cfg.quality });
      input.addEventListener('change', renderWarn);
      const perHour = I18N.num((q.bitrate * 3600) / 8 / 1024 ** 3, 1);
      return el('label', { className: 'q' }, input, el('div', {},
        el('b', { textContent: qualityName(q.id) }),
        el('div', { className: 'meta', textContent: t('pc.quality.meta', { height: q.height, fps: q.fps, rate: mbps(q.bitrate), perHour }) }),
        el('div', { className: 'risk r' + (RISK[q.id] ?? 1), textContent: t(`pc.quality.${q.id}.risk`) })));
    }));
    $('dir').value = cfg.outDir;
    $('pick').hidden = !cfg.canPick;
    // "Automatic" follows Windows; each language is named in its own language.
    const auto = el('option', { value: '', textContent: t('pc.settings.languageAuto', { lang: I18N.name(I18N.lang) }) });
    $('lang').replaceChildren(auto, ...cfg.locales.map((code) => {
      let label = code;
      try { label = new Intl.DisplayNames([code], { type: 'language' }).of(code); } catch {}
      return el('option', { value: code, textContent: label.charAt(0).toUpperCase() + label.slice(1) });
    }));
    $('lang').value = cfg.language || '';
    $('buffer').replaceChildren(...(cfg.buffers || [0]).map((n) => el('option', { value: String(n), textContent: n ? t('pc.buffer.seconds', { n }) : t('pc.buffer.off') })));
    $('buffer').value = String(cfg.buffer || 0);
    $('auto-update').checked = !cfg.noUpdateCheck;
    renderBufferHelp();
    renderWarn();
    $('settings').hidden = false;
  }

  $('open-settings').addEventListener('click', openSettings);
  $('buffer').addEventListener('change', renderBufferHelp);
  $('close-settings').addEventListener('click', () => { $('settings').hidden = true; });
  $('pick').addEventListener('click', async () => {
    $('pick').disabled = true;
    try {
      const r = await post('/api/pick-folder');
      if (r.ok) { const { path } = await r.json(); if (path) $('dir').value = path; }
    } finally { $('pick').disabled = false; }
  });
  $('save').addEventListener('click', async () => {
    const language = $('lang').value;
    const r = await post('/api/settings', { quality: selected(), outDir: $('dir').value.trim(), language, buffer: Number($('buffer').value), noUpdateCheck: !$('auto-update').checked });
    if (!r.ok) {
      let m = { key: 'error.badRequest' };
      try { m = await r.json(); } catch {}
      $('msg').textContent = I18N.msg(m); $('msg').className = 'err';
      return;
    }
    $('msg').textContent = t('pc.settings.saved'); $('msg').className = 'ok';
    if (language !== (cfg.language || '')) { setTimeout(() => location.reload(), 500); return; }
    setTimeout(() => { $('settings').hidden = true; }, 700);
  });

  for (const what of ['licenses', 'source']) {
    $('lnk-' + what).addEventListener('click', (e) => { e.preventDefault(); post('/api/open/' + what); });
  }

  (async () => {
    let language = '';
    try { language = (await (await fetch('/api/settings', { cache: 'no-store' })).json()).language || ''; } catch {}
    await I18N.init(language);
    tick(); setInterval(tick, 1000);
  })();
</script>
</body>
</html>
